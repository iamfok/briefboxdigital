<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin Panel | Briefbox Digital</title><link rel="icon" href="/assets/mark.png">
<style>
:root{--bg:#f4f5f8;--sb:#0a0a0a;--bd:#e5e7eb;--tx:#111827;--mu:#6b7280;--c1:#6a14f5;--c2:#ff7a00;--ok:#16a34a;--er:#dc2626}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--tx);font:13.5px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}a{color:inherit;text-decoration:none}svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--bd);background:#fff;border-radius:8px;padding:7px 13px;cursor:pointer;transition:.15s}.btn:hover{border-color:#111}.btn.k{background:#0a0a0a;color:#fff;border-color:#0a0a0a}.btn.p{border:0;color:#fff;font-weight:600;background:linear-gradient(90deg,var(--c1),var(--c2))}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.sm{padding:3px 8px;font-size:12px}.btn.d:hover{border-color:var(--er);color:var(--er)}
input,textarea,select{width:100%;background:#fff;border:1px solid #d1d5db;border-radius:8px;padding:8px 11px;outline:0;transition:.15s}input:focus,textarea:focus,select:focus{border-color:#111;box-shadow:0 0 0 3px rgba(17,24,39,.08)}textarea{font:12.5px/1.5 ui-monospace,Menlo,monospace;resize:vertical}
.lg{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.lgl{background:#0a0a0a;color:#fff;display:flex;flex-direction:column;justify-content:center;padding:60px;background-image:radial-gradient(500px 300px at 20% 10%,rgba(106,20,245,.45),transparent),radial-gradient(400px 300px at 90% 100%,rgba(255,122,0,.3),transparent)}.lgl img{width:230px}.lgl h2{font-size:28px;margin:28px 0 8px}.lgl p{color:#a1a1aa;max-width:380px}.lgr{display:grid;place-items:center;padding:30px;background:#fff}.lgr>div{width:min(380px,100%)}.lgr h1{font-size:22px;margin:0 0 4px}.lgr .s{color:var(--mu);margin:0 0 22px}
.fl{display:block;margin-bottom:14px}.fl>span{display:block;font-size:12px;color:var(--mu);margin-bottom:5px;font-weight:600}.fl small{display:block;color:var(--mu);font-size:11.5px;margin-top:4px}
.sh{display:flex;height:100vh}.sb{width:240px;background:var(--sb);color:#fff;display:flex;flex-direction:column;flex:none;transition:.25s}.sb.c{width:64px}.sbh{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #27272a}.sbh img{height:34px}.sbh button{background:none;border:0;color:#a1a1aa;cursor:pointer}.sb.c .sbh img,.sb.c .lb,.sb.c h4{display:none}.sb nav{flex:1;overflow:auto;padding:8px 0}.sb h4{margin:14px 16px 4px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#71717a}
.ni{display:flex;gap:12px;align-items:center;width:100%;padding:11px 18px;border:0;background:none;color:#a1a1aa;cursor:pointer;text-align:left;font-size:12.5px;letter-spacing:.03em}.ni:hover{background:#1f1f22;color:#fff}.ni.on{background:#fff;color:#0a0a0a;font-weight:600}.ni b{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--c2);font-size:0}
.sbf{border-top:1px solid #27272a;padding:6px 0}.mn{flex:1;display:flex;flex-direction:column;min-width:0}.tb{height:64px;background:#fff;border-bottom:1px solid var(--bd);padding:0 24px;display:flex;align-items:center;gap:12px}.tb .ttl{color:var(--mu);font-size:12px;margin-right:auto}.who{text-align:right;line-height:1.2}.who b{display:block;font-size:12px}.who small{color:var(--mu);font-size:10.5px}.av{width:32px;height:32px;border-radius:50%;background:#0a0a0a;color:#fff;display:grid;place-items:center;font-size:12px;object-fit:cover}.chip{font-size:11.5px;padding:3px 10px;border-radius:99px;background:#fff7ed;color:#c2410c;border:1px solid #fed7aa}
.ct{flex:1;overflow:auto;padding:24px}.in{max-width:1080px}.pt{margin:0 0 4px;font-size:22px}.ps{color:var(--mu);margin:0 0 20px}.burg{display:none}
.cd{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px}.cd>h3{margin:0 0 14px;font-size:14px;display:flex;align-items:center;gap:8px}.cd>h3 small{color:var(--mu);font-weight:400}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}.st{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:18px;display:flex;justify-content:space-between;align-items:flex-start;cursor:pointer;transition:.15s}.st:hover{border-color:#111}.st span{color:var(--mu);font-size:12px;display:block}.st b{font-size:28px;line-height:1.2}.st svg{color:var(--mu)}
.bar{height:7px;background:#eef0f4;border-radius:9px;overflow:hidden;margin:6px 0 10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c1),var(--c2))}
.ck{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #f0f1f4}.ck:last-child{border:0}.ck u{text-decoration:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:#fff7ed;color:#c2410c;flex:none}.ck.ok u{background:#ecfdf5;color:var(--ok)}.ck span{flex:1}.ck small{color:var(--mu);display:block}
.ac{display:flex;gap:8px;flex-wrap:wrap}.ev{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid #f0f1f4}.ev:last-child{border:0}.ev small{color:var(--mu);margin-left:auto;white-space:nowrap}
.fd{margin-bottom:13px}.fd>label>span,.fd>b{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:4px}.fd small{display:block;color:var(--mu);font-size:11.5px;margin-top:3px}.fd small.n{text-align:right}.fd small.bad{color:#c2410c}
.sub{border-left:2px solid var(--bd);padding-left:14px;margin:6px 0 14px}.sub>b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--c1);margin-bottom:10px}
.row{display:flex;gap:6px;align-items:center;margin-bottom:6px}.row input{flex:1}
details.it{border:1px solid var(--bd);border-radius:10px;margin:7px 0;background:#fafafa}details.it>summary{cursor:pointer;padding:9px 12px;font-weight:600;display:flex;gap:8px;align-items:center;list-style:none}details.it>summary::before{content:"▸";color:var(--c2);transition:.2s}details.it[open]>summary::before{transform:rotate(90deg)}details.it>summary span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}details.it>div{padding:6px 12px 6px}
.cl{display:flex;gap:8px}.cl input[type=color]{width:44px;height:36px;padding:2px;flex:none;cursor:pointer}
.sw{position:relative;display:inline-block;width:40px;height:22px}.sw input{opacity:0;width:0;height:0}.sw s{position:absolute;inset:0;background:#d1d5db;border-radius:99px;cursor:pointer;transition:.2s}.sw s::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}.sw input:checked+s{background:#0a0a0a}.sw input:checked+s::after{transform:translateX(18px)}
.ml{display:grid;grid-template-columns:260px 1fr;gap:16px}.ls{position:sticky;top:0;align-self:start}.li{display:block;width:100%;text-align:left;padding:9px 12px;margin-top:6px;border:1px solid var(--bd);border-radius:10px;background:#fff;cursor:pointer}.li:hover{border-color:#111}.li.on{border-color:#0a0a0a;box-shadow:inset 3px 0 var(--c2)}.li small{display:block;color:var(--mu)}
.tbl{width:100%;border-collapse:collapse}.tbl td,.tbl th{text-align:left;padding:8px 10px;border-bottom:1px solid #f0f1f4}.tbl th{font-size:11px;text-transform:uppercase;color:var(--mu)}
#tt{position:fixed;right:20px;bottom:20px;z-index:99;display:grid;gap:10px}.t{min-width:250px;max-width:360px;background:#0a0a0a;color:#fff;border-left:4px solid var(--ok);border-radius:10px;padding:11px 14px;box-shadow:0 14px 40px -10px #0006}.t.e{border-left-color:var(--er)}
@media(max-width:900px){.lg{grid-template-columns:1fr}.lgl{display:none}.sb{position:fixed;left:-250px;height:100vh;z-index:40}.sb.o{left:0}.burg{display:inline-flex}.ml{grid-template-columns:1fr}.ls{position:static}.who{display:none}.tb{padding:0 14px}}
</style></head><body><div id="app"></div><div id="tt"></div>
<script>
const $=s=>document.querySelector(s),FILES=['site','services','pages','posts','faqs'],K='bb_admin';
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const mk=(t,h,c)=>{const e=document.createElement(t);if(h)e.innerHTML=h;if(c)e.className=c;return e};
const IC={dash:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',nav:'<circle cx="12" cy="12" r="10"/><path d="m16.2 7.8-2.1 6.3-6.3 2.1 2.1-6.3z"/>',seo:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',svc:'<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',tag:'<path d="M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4z"/><circle cx="7.5" cy="7.5" r=".5"/>',file:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v4a2 2 0 0 0 2 2h4M10 9H8M16 13H8M16 17H8"/>',pen:'<path d="M12 20h9"/><path d="M16.4 3.6a2.1 2.1 0 0 1 3 3L7.4 18.6l-4 1 1-4z"/>',help:'<circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/>',img:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',plug:'<path d="M12 22v-5M9 8V2M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8z"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',menu:'<path d="M4 12h16M4 6h16M4 18h16"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',ext:'<path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>'};
const ico=n=>`<svg viewBox="0 0 24 24">${IC[n]}</svg>`;
let cfg=JSON.parse(localStorage.getItem(K)||'{}'),S={},SH={},dirty=new Set(),view=(location.hash||'#dash').slice(1),sel=0,q='',me={},rp={},curF='site';
const V=[{id:'dash',t:'Dashboard',i:'dash'},{id:'home',t:'Homepage',i:'home',f:'site',k:['home']},{id:'menus',t:'Header & Footer',i:'nav',f:'site',k:['nav','cta','footer','social']},{id:'seo',t:'SEO & Branding',i:'seo',f:'site',k:['brand','domain','email','phone','address','tagline','description','theme','cover']},{id:'pgs',t:'Page Texts',i:'file',f:'site',k:['pg']},
{id:'services',t:'Services',i:'svc',f:'services',list:1,omit:['tiers','from']},{id:'pricing',t:'Pricing',i:'tag',f:'services',list:1,only:['from','tiers']},{id:'pages',t:'Pages',i:'file',f:'pages',list:1},{id:'posts',t:'Blog',i:'pen',f:'posts',list:1},{id:'faqs',t:'FAQs',i:'help',f:'faqs',k:['home','blog','pricing']},{id:'media',t:'Media Library',i:'img'},
{id:'integ',t:'Tracking & Booking',i:'plug',f:'site',k:['track','book','forms']},{id:'team',t:'Users & Access',i:'users'}];
const GR=[['Overview',['dash']],['Website',['home','menus','seo','pgs']],['Content',['services','pricing','pages','posts','faqs','media']],['System',['integ','team']]];
const api=(p,o={})=>fetch('https://api.github.com/repos/'+cfg.repo+(p?'/'+p:''),{...o,headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json',...(o.body?{'Content-Type':'application/json'}:{})}}).then(async r=>{const j=await r.json();if(!r.ok)throw new Error(j.message||r.status);return j});
const dec=b=>JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g,'')),c=>c.charCodeAt(0))));
const ago=d=>{const m=Math.round((Date.now()-new Date(d))/6e4);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'};
function toast(m,t){const x=mk('div',esc(m),'t '+(t||''));$('#tt').append(x);setTimeout(()=>x.remove(),5000)}
function login(m){$('#app').innerHTML=`<div class="lg"><div class="lgl"><img src="/assets/logo.png" alt="Briefbox Digital"><h2>Website Admin Panel</h2><p>Manage pages, pricing, blog, FAQs, SEO and tracking. Changes publish to your live site automatically.</p></div><div class="lgr"><div><h1>Sign in</h1><p class="s">Use your GitHub repository access</p>
<label class="fl"><span>GitHub repository</span><input id="r" placeholder="username/briefboxdigital" value="${esc(cfg.repo)}"></label><label class="fl"><span>Branch</span><input id="b" value="${esc(cfg.branch||'main')}"></label>
<label class="fl"><span>Access token</span><div class="row" style="margin:0"><input id="t" type="password" placeholder="github_pat_..." value="${esc(cfg.token)}"><button type="button" class="btn" id="eye">Show</button></div><small>Fine-grained token with Contents: Read and write. Stored only in this browser.</small></label>
<div id="le" style="color:var(--er);margin-bottom:12px"></div><button class="btn k" id="go" style="width:100%;justify-content:center;padding:11px">Sign in</button></div></div></div>`;
 $('#le').textContent=m||'';$('#eye').onclick=()=>{const t=$('#t');t.type=t.type==='password'?'text':'password'};
 $('#go').onclick=async()=>{const b=$('#go');cfg={repo:$('#r').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\/+$/,''),branch:$('#b').value.trim()||'main',token:$('#t').value.replace(/\s/g,'')};b.textContent='Connecting…';b.disabled=true;
  try{const u=await fetch('https://api.github.com/user',{headers:{Authorization:'Bearer '+cfg.token}});if(u.status===401)throw new Error('Token is wrong, expired or copied incompletely. Create a new token.');me=await u.json();
   try{rp=(await api('')).permissions||{}}catch(e){throw new Error(/not found/i.test(e.message)?'Repo "'+cfg.repo+'" not found for this token (signed in as '+(me.login||'?')+'). Check the spelling and the token Repository access.':e.message)}
   localStorage.setItem(K,JSON.stringify(cfg));await boot()}catch(e){b.textContent='Sign in';b.disabled=false;$('#le').textContent=e.message}}}
async function boot(){$('#app').innerHTML='<div class="lg" style="display:grid;place-items:center">Loading your workspace…</div>';
 try{await Promise.all(FILES.map(async f=>{const r=await api('contents/content/'+f+'.json?ref='+cfg.branch);SH[f]=r.sha;S[f]=dec(r.content)}));
  if(!me.login)me=await fetch('https://api.github.com/user',{headers:{Authorization:'Bearer '+cfg.token}}).then(r=>r.json()).catch(()=>({}));
  if(!rp.push&&!rp.admin)rp=(await api('').catch(()=>({}))).permissions||{};const st=S.site;st.cover??='';st.home.cover??='';Object.values(st.pg).forEach(x=>x.cover??='');['services','pages','posts'].forEach(f=>S[f].forEach(x=>x.cover??=''));shell()}
 catch(e){login('Could not load content: '+e.message+(/not found/i.test(e.message)?' (is the content folder fully uploaded to branch '+cfg.branch+'?)':''))}}
const role=()=>rp.admin?'Super Admin':rp.push?'Editor':'Viewer (read only)';
function shell(){$('#app').innerHTML=`<div class="sh"><aside class="sb" id="sb"><div class="sbh"><img src="/assets/logo.png" alt=""><button id="cl" title="Collapse">${ico('menu')}</button></div><nav id="nv"></nav><div class="sbf"><a class="ni" href="/" target="_blank">${ico('ext')}<span class="lb">View website</span></a></div></aside><div class="mn"><header class="tb"><button class="btn burg" id="bg">${ico('menu')}</button><span class="ttl">Admin Panel</span><span class="chip" id="dc" hidden></span><button class="btn p" id="sv" disabled>Save &amp; publish</button>${me.avatar_url?`<img class="av" src="${esc(me.avatar_url)}" alt="">`:`<span class="av">${esc((me.login||'A')[0].toUpperCase())}</span>`}<div class="who"><b>${esc(me.name||me.login||'Admin')}</b><small>${role()}</small></div><button class="btn" id="lo" title="Logout">${ico('out')}</button></header><main class="ct" id="ct"></main></div></div>`;
 $('#sv').onclick=save;$('#bg').onclick=()=>$('#sb').classList.toggle('o');$('#cl').onclick=()=>$('#sb').classList.toggle('c');$('#lo').onclick=()=>{if(dirty.size&&!confirm('You have unsaved changes. Logout anyway?'))return;localStorage.removeItem(K);cfg={};dirty.clear();login()};render()}
function nav(){$('#nv').innerHTML=GR.map(([g,ids])=>`<h4>${g}</h4>`+ids.map(id=>{const v=V.find(x=>x.id===id);return `<button class="ni ${id===view?'on':''}" data-v="${id}" title="${v.t}">${ico(v.i)}<span class="lb">${v.t}</span>${v.f&&dirty.has(v.f)?'<b>.</b>':''}</button>`}).join('')).join('');
 document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v))}
function go(id){view=id;sel=0;q='';location.hash=id;$('#sb').classList.remove('o');render()}
function ui(){const n=dirty.size;$('#sv').disabled=!n||!(rp.push||rp.admin);$('#dc').hidden=!n;$('#dc').textContent=n+' unsaved';nav()}
function render(){let v=V.find(x=>x.id===view);if(!v){view='dash';v=V[0]}const ct=$('#ct'),w=mk('div','','in');curF=v.f||'site';ct.innerHTML='';ct.append(w);w.append(mk('h1',esc(v.t),'pt'));
 const sub={dash:'Overview of your website, SEO health and launch checklist.',home:'Hero, sections, FAQ titles and call to action.',menus:'Menus, footer links and social profiles.',seo:'Company details, default description and brand colours.',pgs:'Titles, headings and intro text of hub, pricing, blog and contact pages.',services:'Service pages: headings, features, long content, process and FAQs.',pricing:'Packages and prices. Add a payment link to enable Buy now.',pages:'About, Privacy, Terms, Cookies and any new page.',posts:'Blog articles. Link to a service to add internal links.',faqs:'Questions shown on the homepage, blog and pricing pages.',media:'Upload images and use them in pages and posts.',integ:'Analytics, ad pixels, form endpoint and booking link.',team:'Who can edit your website.'}[view];w.append(mk('p',sub||'','ps'));
 view==='dash'?dash(w):view==='media'?media(w):view==='team'?team(w):v.list?listView(v,w):formView(v,w);ui()}
const chg=f=>{dirty.add(f);ui()};
async function save(){const b=$('#sv');b.disabled=true;b.textContent='Publishing…';
 try{for(const f of [...dirty]){const r=await api('contents/content/'+f+'.json',{method:'PUT',body:JSON.stringify({message:'Update '+f+' via admin',content:btoa(unescape(encodeURIComponent(JSON.stringify(S[f],null,1)+'\n'))),sha:SH[f],branch:cfg.branch})});SH[f]=r.content.sha;dirty.delete(f)}toast('Published! Your live site updates in about a minute.')}
 catch(e){toast('Save failed: '+(/not accessible|forbidden|403/i.test(e.message)?'your token is read-only. In GitHub open the token, set Contents to Read and write, save it and try again.':e.message),'e')}b.textContent='Save & publish';ui()}
/* dashboard */
const len=(s,a,b)=>{const n=String(s||'').length;return n>=a&&n<=b};
function dash(w){const s=S.site,sv=S.services,tiers=sv.flatMap(x=>x.tiers),paid=tiers.filter(t=>t.pay).length;
 const seo=[];const add=(ok,l,v)=>{if(!ok)seo.push([l,v])};
 add(len(s.home.meta,30,60),'Home title should be 30-60 characters','home');add(len(s.description,70,160),'Site description should be 70-160 characters','seo');
 sv.forEach(x=>{add(len(x.seo_title,30,60),x.name+': SEO title 30-60 characters','services');add(len(x.meta,70,160),x.name+': meta description 70-160 characters','services')});
 S.pages.forEach(x=>add(len(x.desc,70,160),'Page "'+x.title+'": description 70-160 characters','pages'));S.posts.forEach(x=>add(len(x.desc,70,160),'Post "'+x.title+'": description 70-160 characters','posts'));
 const chk=[[s.track.gtm||s.track.ga4,'Analytics connected','Add your GTM or GA4 ID','integ'],[s.track.meta,'Meta Pixel connected','Add your Meta Pixel ID','integ'],[s.track.ads,'Google Ads connected','Add your Google Ads ID','integ'],[s.book.url,'Google Calendar booking link','Paste your booking link','integ'],[s.forms.endpoint,'Contact form delivers email','Add a Formspree endpoint','integ'],[paid===tiers.length,'Payment links ('+paid+'/'+tiers.length+')','Add a checkout link to every package','pricing'],[s.social.every(x=>x.u.replace(/\/$/,'').split('/').length>3),'Real social profile links','Replace the placeholder links','menus'],[s.address&&s.phone,'Company address and phone (trust and local SEO)','Add them in SEO & Branding','seo']];
 const done=chk.filter(c=>c[0]).length,pc=Math.round(done/chk.length*100),sc=Math.max(0,100-seo.length*6);
 w.innerHTML+=`<div class="gr">${[['Services',sv.length,'svc','services'],['Packages',tiers.length,'tag','pricing'],['Pages',S.pages.length,'file','pages'],['Blog posts',S.posts.length,'pen','posts']].map(x=>`<div class="st" data-g="${x[3]}"><div><span>${x[0]}</span><b>${x[1]}</b></div>${ico(x[2])}</div>`).join('')}</div>

async function media(w){const c=mk('div','<div class="cd"><h3>Upload image</h3><input type="file" id="fu" accept="image/*"><small style="color:var(--mu)">Cover size: about 1600x600 px, under 300 KB (WebP or compressed JPG). Use a new file name when you replace an image. The file path appears below after upload.</small></div><div class="cd"><h3>Uploaded files</h3><div id="ml">Loading…</div></div>');w.append(c);

const lim=(k,pp)=>(k==='seo_title'||pp==='home.meta'||/^pg\.\w+\.title$/.test(pp))?[30,60,'title']:(/^(description|desc)$/.test(k)||pp==='meta'||/^pg\.\w+\.desc$/.test(pp))?[70,160,'description']:0;
function inp(o,k,pp){const v=o[k],set=x=>{o[k]=x;chg(curF)};let i;
 if(k==='cover'){const g=mk('div','<input placeholder="/assets/uploads/cover.jpg"><button type="button" class="btn">Choose image</button>','cl'),t=g.children[0],b=g.children[1];t.value=v||'';t.oninput=()=>set(t.value);
  b.onclick=async()=>{b.textContent='Loading…';try{const r=await api('contents/assets/uploads?ref='+cfg.branch),im=r.filter(f=>/\.(jpe?g|png|webp|avif|gif|svg)$/i.test(f.name));if(!im.length)throw 0;const s=mk('select','<option value="">Select an image…</option>'+im.map(f=>'<option>/assets/uploads/'+esc(f.name)+'</option>').join(''));s.onchange=()=>{t.value=s.value;set(s.value);s.remove()};g.after(s)}catch(x){toast('No images yet. Upload one in Media Library first.','e')}b.textContent='Choose image'};return g}
 if(typeof v==='boolean'){const l=mk('label','<input type="checkbox"><s></s>','sw');i=l.firstChild;i.checked=v;i.onchange=()=>set(i.checked);return l}
 if(typeof v==='number'){i=mk('input');i.type='number';i.value=v;i.oninput=()=>set(+i.value);return i}
 if(isHex(v)){const g=mk('div','<input type="color"><input>','cl'),c=g.children[0],t=g.children[1];c.value=t.value=v;c.oninput=()=>{t.value=c.value;set(c.value)};t.oninput=()=>{if(isHex(t.value)){c.value=t.value;set(t.value)}};return g}
 if(String(v).length>70||/[\n<]/.test(v)||/^(body|custom|intro|p|a)$/.test(k)){i=mk('textarea');i.rows=Math.min(14,Math.max(3,Math.ceil(String(v).length/80)));i.value=v;i.oninput=()=>set(i.value);return i}
 i=mk('input');i.value=v??'';i.placeholder=(HP[pp]||HP[k]||[])[0]||'';i.oninput=()=>set(i.value);return i}
function F(o,k,box,p,top){const v=o[k],pp=String(p||k).replace(/\.\d+/g,''),w=mk('div','','fd');
 if(Array.isArray(v)){if(!top)w.append(mk('b',esc(hum(k))));const L=mk('div'),draw=()=>{L.innerHTML='';v.forEach((x,i)=>{
   const btn=(t,f)=>{const b=mk('button',t,'btn sm'+(t==='✕'?' d':''));b.type='button';b.onclick=e=>{e.preventDefault();f()};return b},
   mv=d=>()=>{const j=i+d;if(j<0||j>=v.length)return;[v[i],v[j]]=[v[j],v[i]];chg(curF);draw()},rm=()=>{if(confirm('Remove this item?')){v.splice(i,1);chg(curF);draw()}};
   if(x&&typeof x==='object'){const dt=mk('details','','it'),sm=mk('summary','<span>'+esc(ttl(x)||hum(i))+'</span>'),bd=mk('div');sm.append(btn('↑',mv(-1)),btn('↓',mv(1)),btn('✕',rm));dt.append(sm,bd);Object.keys(x).forEach(y=>F(x,y,bd,pp+'.'+y));L.append(dt)}
   else{const r=mk('div','','row');r.append(inp(v,i,pp+'.'+i),btn('↑',mv(-1)),btn('↓',mv(1)),btn('✕',rm));L.append(r)}})};
  draw();const ad=mk('button','+ Add','btn sm');ad.type='button';ad.onclick=()=>{v.push(blank(v[0]??''));chg(curF);draw()};w.append(L,ad)}
 else if(v&&typeof v==='object'){const s=mk('div','','sub');s.append(mk('b',esc(hum(k))));Object.keys(v).forEach(y=>F(v,y,s,pp+'.'+y));w.append(s)}
 else{const el=inp(o,k,pp);if(typeof v==='boolean')w.append(mk('b',esc(hum(k))),el);else{const l=mk('label');l.append(mk('span',esc(hum(k))),el);w.append(l)}
  const h=HP[pp]||HP[k];if(h&&h[1])w.append(mk('small',esc(h[1])));
  const m=lim(k,pp);if(m){const n=mk('small','','n'),u=()=>{const L=String(o[k]).length;n.textContent=L+' characters (best '+m[0]+'-'+m[1]+')';n.className='n'+(L>m[1]||L<m[0]?' bad':'')};u();el.addEventListener('input',u);w.append(n)}}
 box.append(w)}
function formView(v,w){const d=S[v.f],ks=v.k.filter(k=>k in d),pr=ks.filter(k=>typeof d[k]!=='object');
 if(pr.length){const c=mk('div','<h3>General</h3>','cd');pr.forEach(k=>F(d,k,c,k));w.append(c)}
 ks.filter(k=>typeof d[k]==='object').forEach(k=>{const c=mk('div','<h3>'+esc(hum(k))+'</h3>','cd'),x=d[k];if(Array.isArray(x))F(d,k,c,k,1);else Object.keys(x).forEach(y=>F(x,y,c,k+'.'+y));w.append(c)})}
function listView(v,w){const a=S[v.f],lab=x=>x.name||x.title||x.slug||'Untitled',sub=x=>x.date||x.slug||'',wrap=mk('div','','ml'),ls=mk('div','','ls'),ed=mk('div'),L=mk('div');
 const s=mk('input');s.placeholder='Search…';s.value=q;s.oninput=()=>{q=s.value;drawL()};

 nb.onclick=()=>{const n=blank(a[0]);if('slug' in n)n.slug='new-'+(Date.now()%10000);if('date' in n)n.date=new Date().toISOString().slice(0,10);if('title' in n)n.title='New item';if('name' in n)n.name='New item';a.unshift(n);sel=0;q='';s.value='';chg(v.f);drawL();drawE()};

 function drawE(){ed.innerHTML='';const x=a[sel];if(!x){ed.append(mk('div','Nothing here yet. Click “+ New”.','cd'));return}
  const c=mk('div','','cd'),bar=mk('div','','ac'),act=(t,f,k)=>{const b=mk('button',t,'btn sm'+(k||''));b.onclick=f;bar.append(b)},mv=d=>()=>{const j=sel+d;if(j<0||j>=a.length)return;[a[sel],a[j]]=[a[j],a[sel]];sel=j;chg(v.f);drawL();drawE()};
  c.append(mk('h3',esc(lab(x))));bar.style.marginBottom='16px';
  act('↑ Move up',mv(-1));act('↓ Move down',mv(1));
  act('Duplicate',()=>{const n=JSON.parse(JSON.stringify(x));if(n.slug)n.slug+='-copy';a.splice(sel+1,0,n);sel++;chg(v.f);drawL();drawE()});
  act('Delete',()=>{if(!confirm('Delete this item?'))return;a.splice(sel,1);sel=Math.max(0,sel-1);chg(v.f);drawL();drawE()},' d');
